<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>토벌전 스킬가속 동기화 계산기 (Advanced)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #2c3e50; }
        h1 { border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        h2 { margin-top: 30px; font-size: 1.2em; border-left: 4px solid #3498db; padding-left: 10px; }
        .input-group { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        input[type="number"] { width: 100px; padding: 5px; border: 1px solid #ccc; border-radius: 5px; text-align: right; }
        button { background-color: #3498db; color: white; border: none; padding: 15px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 20px; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        .result-box { margin-top: 30px; padding: 20px; background-color: #e8f4f8; border-radius: 5px; display: none; }
        .section { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed #b0c4de; }
        .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .warning { color: #e74c3c; font-weight: bold; }
        .success { color: #27ae60; font-weight: bold; }
        .highlight { background-color: #ffffcc; padding: 2px 5px; border-radius: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h1>⏱️ 스냅샷 버프 체인 종합 계산기</h1>
    
    <div class="input-section">
        <h2>[데이터 입력] 스킬가속 셋팅</h2>
        <div class="input-group">
            <label><b>공통 장비 스킬가속 (%)</b></label>
            <input type="number" id="eqHaste" value="30.4" step="0.1">
        </div>
        <div class="input-group">
            <label>정글전사 슈가룬 스킬가속 (기본쿨 10초)</label>
            <input type="number" id="runeJungle" value="10.0" step="0.1">
        </div>
        <div class="input-group">
            <label>석류맛 슈가룬 스킬가속 (기본쿨 10초)</label>
            <input type="number" id="runePome" value="0.0" step="0.1">
        </div>
        <div class="input-group">
            <label>실론나이트 슈가룬 스킬가속 (기본쿨 10초)</label>
            <input type="number" id="runeCeylon" value="0.0" step="0.1">
        </div>
        <div class="input-group">
            <label>치즈케이크맛 슈가룬 스킬가속 (기본쿨 8초)</label>
            <input type="number" id="runeCheese" value="7.0" step="0.1">
        </div>
        <div class="input-group">
            <label>피겨여왕 슈가룬 스킬가속 (기본쿨 8초)</label>
            <input type="number" id="runeFig" value="0.0" step="0.1">
        </div>
        <div class="input-group">
            <label><b>브라이트시커 슈가룬 스킬가속</b> (기본쿨 9초)</label>
            <input type="number" id="runeSeeker" value="14.0" step="0.1">
        </div>

        <button onclick="calculateSync()">타임라인 종합 검증 실행</button>
    </div>

    <div class="result-box" id="resultArea">
        <div class="section">
            <h2>STEP 1: 다발 시너지 선행 검증</h2>
            <p id="jungleResult"></p>
        </div>

        <div class="section">
            <h2>STEP 2: 무한 버프 가동률 검증 (유지시간 7초 기준)</h2>
            <p id="ceylonResult"></p>
            <p id="cheeseResult"></p>
        </div>

        <div class="section">
            <h2>STEP 3: 브라이트시커 스냅샷 동기화 검증</h2>
            <p id="syncResult"></p>
            <p id="prescription"></p>
        </div>
    </div>
</div>

<script>
function calcCD(base, totalHaste) {
    return (base * 100) / (100 + totalHaste);
}

function calculateSync() {
    const eqHaste = parseFloat(document.getElementById('eqHaste').value) || 0;
    const rJungle = parseFloat(document.getElementById('runeJungle').value) || 0;
    const rPome = parseFloat(document.getElementById('runePome').value) || 0;
    const rCeylon = parseFloat(document.getElementById('runeCeylon').value) || 0;
    const rCheese = parseFloat(document.getElementById('runeCheese').value) || 0;
    const rFig = parseFloat(document.getElementById('runeFig').value) || 0;
    const rSeeker = parseFloat(document.getElementById('runeSeeker').value) || 0;

    // STEP 1: 정글전사 vs 석류맛 선행 조건
    const cdJungle = calcCD(10, eqHaste + rJungle);
    const cdPome = calcCD(10, eqHaste + rPome);
    
    let jungleStatus = `정글전사 쿨타임: <b>${cdJungle.toFixed(2)}초</b> / 석류맛 쿨타임: <b>${cdPome.toFixed(2)}초</b><br>`;
    if (cdJungle < cdPome) {
        jungleStatus += "<span class='success'>✔️ 정상 작동: 정글전사가 석류맛보다 먼저 스킬을 시전하여 시너지가 정상 부여됩니다.</span>";
    } else {
        const requiredRuneJungle = rPome + 0.1; 
        jungleStatus += `<span class='warning'>❌ 순서 역전: 석류맛이 먼저 시전됩니다. 정글전사의 슈가룬 스킬가속을 석류맛보다 높게 (최소 <span class='highlight'>+${requiredRuneJungle.toFixed(1)}</span> 이상) 세팅하십시오.</span>`;
    }

    // STEP 2: 실론나이트 & 치즈케이크 무한 유지 (7초 컷)
    const cdCeylon = calcCD(10, eqHaste + rCeylon);
    const cdCheese = calcCD(8, eqHaste + rCheese);
    
    const requiredTotalCeylon = (1000 / 7) - 100; // 약 42.86
    const requiredTotalCheese = (800 / 7) - 100;  // 약 14.29

    let ceylonStatus = `▪️ 실론나이트 (보스피해) 쿨타임: <b>${cdCeylon.toFixed(2)}초</b> ➔ `;
    if (cdCeylon <= 7.0) {
        ceylonStatus += "<span class='success'>무한 유지 가능</span>";
    } else {
        const reqRuneCeylon = Math.max(0, requiredTotalCeylon - eqHaste);
        ceylonStatus += `<span class='warning'>버프 공백 발생. 무한 유지를 위해 슈가룬 스킬가속 <span class='highlight'>+${reqRuneCeylon.toFixed(1)}</span> 이상 필요.</span>`;
    }

    let cheeseStatus = `▪️ 치즈케이크 (공격력) 쿨타임: <b>${cdCheese.toFixed(2)}초</b> ➔ `;
    if (cdCheese <= 7.0) {
        cheeseStatus += "<span class='success'>무한 유지 가능</span>";
    } else {
        const reqRuneCheese = Math.max(0, requiredTotalCheese - eqHaste);
        cheeseStatus += `<span class='warning'>버프 공백 발생. 무한 유지를 위해 슈가룬 스킬가속 <span class='highlight'>+${reqRuneCheese.toFixed(1)}</span> 이상 필요.</span>`;
    }

    // STEP 3: 브라이트시커 vs 피겨여왕 동기화
    const totalFigHaste = eqHaste + rFig;
    const totalSeekerHaste = eqHaste + rSeeker;
    
    const cdFig = calcCD(8, totalFigHaste);
    const cdSeeker = calcCD(9, totalSeekerHaste);

    const targetTotalSeekerHaste = (totalFigHaste * 1.125) + 12.5;
    const targetRuneSeekerHaste = targetTotalSeekerHaste - eqHaste;

    let syncStatus = `▪️ 피겨여왕 최종 쿨타임: <b>${cdFig.toFixed(3)}초</b><br>▪️ 브라이트시커 최종 쿨타임: <b>${cdSeeker.toFixed(3)}초</b><br><br>`;
    let prescription = "";

    const diff = Math.abs(cdFig - cdSeeker);
    
    if (diff < 0.01) {
        syncStatus += "<span class='success'>✔️ 완벽 동기화! 치명피해 65% 장판 스냅샷 누수가 없습니다.</span>";
        prescription = "현재 세팅을 그대로 유지하십시오. 남는 슈가룬 슬롯은 딜 옵션으로 채우세요.";
    } else {
        syncStatus += `<span class='warning'>❌ 동기화 불일치 (격차 ${diff.toFixed(3)}초). 전투 후반부 장판 궤적 변수에 의해 버프를 놓칠 수 있습니다.</span>`;
        prescription = `<b>[슈가룬 교체 처방]</b><br>브라이트시커의 슈가룬 스킬가속 합계를 <span class='highlight'><b>+${targetRuneSeekerHaste.toFixed(1)}</b></span> 로 맞추십시오. (현재 ${rSeeker})`;
    }

    // 결과 출력
    document.getElementById('jungleResult').innerHTML = jungleStatus;
    document.getElementById('ceylonResult').innerHTML = ceylonStatus;
    document.getElementById('cheeseResult').innerHTML = cheeseStatus;
    document.getElementById('syncResult').innerHTML = syncStatus;
    document.getElementById('prescription').innerHTML = prescription;
    
    document.getElementById('resultArea').style.display = "block";
}
</script>

</body>
</html>
